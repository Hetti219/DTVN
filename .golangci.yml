version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose     # Check HTTP response body closed
    - dupl          # Code clone detection
    - errcheck      # Check for unchecked errors
    - goconst       # Find repeated strings that could be constants
    - gocritic      # The most opinionated Go linter
    - gocyclo       # Cyclomatic complexity
    - gosec         # Security-focused linter
    - misspell      # Find misspelled English words
    - prealloc      # Find slice declarations that could be preallocated
    - revive        # Fast, configurable, extensible linter
    - unconvert     # Remove unnecessary type conversions
  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*go.etcd.io/bbolt.Tx).Rollback
        - (*go.etcd.io/bbolt.DB).Close
        - (*os.File).Close
        - (*net.Conn).Close
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - whyNoLint
        - unnamedResult
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104 # Errors unhandled (covered by errcheck)
        - G304 # File path provided as taint input (we use user-provided paths intentionally)
    govet:
      enable-all: true
      disable:
        - shadow       # Too strict for this codebase
        - fieldalignment # Pure struct-layout micro-optimisation
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true # Too strict for tests
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true # Not all packages need comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true # Interface implementations may not use all params
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    rules:
      # Exclude some linters from running on test files
      - linters:
          - dupl
          - goconst
          - gocyclo
          - gosec
        path: _test\.go

      # Exclude generated protocol buffer code
      - linters:
          - all
        path: \.pb\.go$

      # Allow init functions (used for crypto key generation)
      - linters:
          - gochecknoinits
        source: func init\(\)

      # Allow globals in main packages
      - linters:
          - gochecknoglobals
        path: cmd/

      # Ignore long lines in generated code
      - linters:
          - lll
        path: proto/

      # Ignore error shadowing in specific cases
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
